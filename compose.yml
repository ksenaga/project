services:
  db:
    image: mysql:8.4
    container_name: db-project
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_DATABASE=project
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - TZ=Asia/Tokyo
    ports:
      - '3306:3306'
    # app が起動を待てるよう、接続できるかを確認する
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uuser', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # フロントエンドとバックエンドをまとめたアプリ(Dockerfile)。http://localhost:8080 で開く
  # 開発中に Mac で動かすバックエンド(3000)とぶつからないよう、8080 で公開する。
  # 開発では DB だけを使うので、profile を指定したときだけ起動する(docker compose --profile app up -d --build)
  app:
    build: .
    container_name: app-project
    profiles: ['app']
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=project
      # .env(.env.example をコピーして作る)の値を使う
      # 未設定だと起動時に「環境変数 JWT_SECRET が設定されていません」で止まる
      - JWT_SECRET=${JWT_SECRET:-}
    ports:
      - '8080:3000'
    restart: unless-stopped

  # 開発用のアプリ(Dockerfile.dev)。ソースをマウントし、保存するとすぐ反映される(ホットリロード)
  # 画面は http://localhost:5173(/api は同じコンテナのバックエンド 3000 に転送される)
  # docker compose --profile dev up -d --build で起動する(Mac で npm run dev を動かしているときは止めてから)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app-project-dev
    profiles: ['dev']
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # node_modules は Mac のものを使わず、コンテナ専用(Linux 用)を名前付きボリュームに置く
      - backend_node_modules:/app/backend/node_modules
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=project
      - JWT_SECRET=${JWT_SECRET:-}
    ports:
      - '3000:3000'
      - '5173:5173'

volumes:
  backend_node_modules:
  frontend_node_modules:
